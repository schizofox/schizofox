[package]
name         = "searx-randomizer"
description  = "An instance randomizer for Searx and Searxng"
version      = "0.3.0"
edition      = "2024"
license      = "MPL-2.0"
readme       = true
repository   = "https://github.com/schizofox/searx-randomizer"
rust-version = "1.85"

[dependencies]
anyhow     = "1.0.100"
clap       = { version = "4.5.51", features = ["derive", "env"] }
log        = "0.4.28"
rand       = "0.9.2"
rouille    = "3.6.2"
serde      = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smol       = "2.0.2"
env_logger = "0.11.8"

[profile.release]
lto       = true
opt-level = "z"
strip     = true
