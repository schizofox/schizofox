[package]
name         = "searx-randomizer"
description  = "An instance randomizer for Searx and Searxng"
version      = "0.3.0"
edition      = "2024"
license      = "MPL-2.0"
repository   = "https://github.com/schizofox/searx-randomizer"
rust-version = "1.88"

[dependencies]
anyhow     = "1.0.104"
env_logger = { version = "0.11.11", default-features = false }
log        = "0.4.34"
pound      = "0.1.8"
rand       = "0.10.3"
serde_json = "1.0.151"
tiny_http  = "0.12.0"

[profile.release]
lto       = "thin"
opt-level = 3
strip     = true
